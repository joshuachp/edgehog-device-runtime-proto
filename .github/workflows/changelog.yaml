name: changelog
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - release-\d+.\d+
# Spend CI time only on latest ref
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  comment-changelog:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      # Needs issue permission to post comments on pull request
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: origin
          sparse-checkout: |
            scripts
      - uses: actions/checkout@v5
        with:
          path: pull-request
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: install git-cliff
        uses: taiki-e/install-action@v2.62.21
        with:
          tool: git-cliff
      - name: create changelog comment
        # Do not run the fork scripts
        run: |
          cd pull-request
          ../origin/scripts/changelog-comment.sh "$FROM" "$TO" "$PR"
        env:
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
